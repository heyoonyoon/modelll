<!doctype html>
<!-- lang은 시작할 때 고른 언어로 바뀐다(src/client/i18n). 제목의 제품 이름은 빌드할 때 src/shared/app.ts의 값이 들어간다 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 화면이 뜨면 제목은 언어와 화면에 맞게 바뀐다. 여기 적힌 값은 스크립트를 돌리지 않는 검색 로봇과 링크 미리보기가 읽는다 -->
    <!-- 제목과 설명, 구조화 데이터, #root 안의 글은 빌드할 때 src/client/pages/homeStatic.ts의 값이 들어간다 -->
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 검색 결과에 큰 미리보기 그림을 써도 된다는 표시. 방 화면에서는 noindex 표시가 따로 붙는다(src/client/seo.ts) -->
    <meta name="robots" content="max-image-preview:large" />
    <!-- 구글 애드센스 사이트 확인과 광고 스크립트. 광고 칸은 src/client/ads/AdSlot.tsx -->
    <meta name="google-adsense-account" content="ca-pub-6945008026146161" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6945008026146161" crossorigin="anonymous"></script>
    <!-- 검색에 나오는 주소는 첫 화면 하나다 -->
    <link rel="canonical" href="https://modelll.app/" />
    <!-- 언어마다 주소가 따로 없다. 한 주소가 브라우저 언어에 맞춰 바뀌므로 x-default 하나만 적는다 -->
    <link rel="alternate" hreflang="x-default" href="https://modelll.app/" />
    <!-- AI 도구가 읽는 요약(public/llms.txt) -->
    <link rel="alternate" type="text/plain" href="https://modelll.app/llms.txt" title="llms.txt" />

    <!-- 아이콘. 그림 파일은 scripts/og/render.mjs로 만든다 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 링크를 붙여 넣었을 때 보이는 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%SHARE_DESCRIPTION%" />
    <meta property="og:url" content="https://modelll.app/" />
    <meta property="og:image" content="https://modelll.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%APP_NAME%: an ER diagram in Chen notation being drawn by two people at once" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%SHARE_DESCRIPTION%" />
    <meta name="twitter:image" content="https://modelll.app/og.png" />
    <meta name="twitter:image:alt" content="%APP_NAME%: an ER diagram in Chen notation being drawn by two people at once" />

    <!-- 구조화 데이터(WebSite, Organization, WebPage, WebApplication, SoftwareSourceCode, FAQPage). WebSite의 name이 검색 결과에 사이트 이름으로 쓰인다 -->
    <!--%STRUCTURED_DATA%-->

    <!-- #root 안의 글(homeStatic.ts)은 스크립트를 돌리지 않는 로봇과 브라우저를 위한 것이다. 스크립트가 켜져 있으면 숨겨 두었다가
         React가 #root를 그리면서 지우므로 화면이 뜨기 전에 비치지 않는다. 스크립트가 꺼져 있으면 아래 noscript가 다시 보이게 한다 -->
    <style>#root > .home-static { display: none; }</style>
    <noscript>
      <style>
        #root > .home-static { display: block; max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; font-size: 16px; line-height: 1.6; color: #171717; }
        .home-static h1 { font-size: 30px; line-height: 1.25; margin: 24px 0 16px; }
        .home-static h2 { font-size: 22px; margin: 40px 0 12px; }
        .home-static h3 { font-size: 17px; margin: 24px 0 6px; }
        .home-static h4 { font-size: 15px; margin: 16px 0 4px; }
        .home-static p, .home-static ul, .home-static ol { margin: 0 0 12px; }
        .home-static pre { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 14px; }
        html #root { height: auto; }
      </style>
    </noscript>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"><!--%HOME_STATIC%--></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
